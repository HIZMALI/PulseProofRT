[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseproof-rt"
version = "0.2.0rc1"
description = "Evidence-based QNX 8 timing, IPC and recovery regression gates"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
pulseproof = "pulseproof.cli:main"

[tool.setuptools.packages.find]
include = ["pulseproof*"]

[tool.setuptools.package-data]
pulseproof = ["web/*"]
